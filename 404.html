<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Snippet Studio</title>
  <style>
    :root {
      --bg: #0b1120;
      --panel: rgba(15, 23, 42, 0.8);
      --text: #eaf2ff;
      --muted: #a8b5d3;
      --primary: #7c8cff;
      --primary-2: #a78bfa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(circle at top left, rgba(124,140,255,0.22), transparent 28%), var(--bg);
    }
    .card {
      width: min(620px, 90vw);
      padding: 40px 30px;
      border-radius: 24px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.08);
      text-align: center;
      box-shadow: 0 28px 56px rgba(0,0,0,0.24);
    }
    h1 { font-size: clamp(2.5rem, 6vw, 4.5rem); margin: 0 0 14px; }
    p { color: var(--muted); line-height: 1.7; margin-bottom: 24px; }
    a {
      display: inline-block;
      padding: 14px 22px;
      border-radius: 12px;
      color: white;
      text-decoration: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>404</h1>
    <p>The page you were looking for is unavailable or has moved. Head back to the Snippet Studio homepage.</p>
    <a href="/index.html">Back to homepage</a>
  </main>
</body>
</html>
